services:
  - type: web
    name: expense-claim
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: EXPENSE_CLAIM
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
